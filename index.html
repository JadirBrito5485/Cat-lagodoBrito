oISOString(),status:'Novo'});for(let c of carrinho){let p=produtos.find(x=>x.id===c.id);if(p)await db.ref('produtos/'+p.id+'/estoque').set(Math.max(0,Number(p.estoque)-c.qtd))}let msg='Olá, quero finalizar minha compra na BRITOTEM.COM%0A%0ADADOS DO CLIENTE%0A';Object.entries(dados).forEach(([k,v])=>msg+=k+': '+encodeURIComponent(v)+'%0A');msg+='%0APRODUTOS%0A';itens.forEach(i=>msg+=encodeURIComponent(i.titulo)+' | Qtd: '+i.quantidade+' | '+encodeURIComponent(dinheiro(i.preco*i.quantidade))+'%0A');msg+='%0ATOTAL: '+encodeURIComponent(dinheiro(total));carrinho=[];atualizarLed();renderCarrinho();window.open('https://wa.me/'+whats(config.whatsapp)+'?text='+msg,'_blank');aviso('Pedido salvo no ADM')};$('formDesejo').onsubmit=async e=>{e.preventDefault();await db.ref('produtos_desejados').push({nome:$('nomeDesejo').value.trim(),produto:$('produtoDesejo').value.trim(),data:new Date().toISOString(),status:'Novo'});e.target.reset();aviso('Pedido salvo no ADM')};$('busca').oninput=renderProdutos;$('abrirAdm').onclick=e=>{e.preventDefault();abrir('modalSenha')};$('entrarAdm').onclick=()=>{if($('senhaAdm').value===SENHA){fechar('modalSenha');abrir('modalAdm');renderAdm('config')}else aviso('Senha incorreta')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderAdm(b.dataset.tab)});function renderAdm(tab){abaAtual=tab;let p=$('painelAdm');if(tab==='config')p.innerHTML=`<div class="campo"><label>Nome do site</label><small>Texto exibido no topo esquerdo do site.</small><input id="cfgNome" value="${limpar(config.nomeSite)}"></div><div class="campo"><label>Whatsapp do vendedor</label><small>Número que recebe compras e abre no ícone flutuante.</small><input id="cfgWhats" value="${limpar(config.whatsapp)}"></div><div class="campo"><label>Faixa dos produtos</label><small>Texto pequeno exibido em todos os produtos.</small><input id="cfgFaixa" value="${limpar(config.faixa)}"></div><button class="btn-save" onclick="salvarConfig()">SALVAR E SAIR</button>`;else if(tab==='produtos')p.innerHTML=produtos.map(cardProduto).join('')||'<div class="vazio">Sem produtos.</div>';else if(tab==='novo')p.innerHTML=`<div class="grid2"><div class="campo"><label>Imagem por URL</label><small>Link da imagem do produto.</small><input id="nImagem"></div><div class="campo"><label>Título</label><small>Nome do produto exibido na loja.</small><input id="nTitulo"></div><div class="campo"><label>Preço</label><small>Valor do produto.</small><input id="nPreco"></div><div class="campo"><label>Estoque</label><small>Quantidade disponível, aparece somente no ADM.</small><input id="nEstoque"></div><div class="campo full"><label>Descrição</label><small>Descrição curta exibida no produto.</small><textarea id="nDescricao"></textarea></div><div class="campo full"><label>Detalhes</label><small>Descrição completa organizada em parágrafos para o menu detalhe.</small><textarea id="nDetalhes"></textarea></div><div class="campo full"><label>Faixa individual</label><small>Opcional. Se vazio usa a faixa geral do ADM.</small><input id="nFaixa"></div></div><button class="btn-save" onclick="cadastrarProduto()">SALVAR E SAIR</button>`;else if(tab==='pedidos'){p.innerHTML='<div id="listaPedidos">Carregando...</div>';carregarPedidos()}else if(tab==='desejos'){p.innerHTML='<div id="listaDesejos">Carregando...</div>';carregarDesejos()}}function cardProduto(p){return `<div class="card-adm"><div class="grid2"><div class="campo"><label>Imagem por URL</label><small>Imagem exibida na grade do produto.</small><input id="img_${p.id}" value="${limpar(p.imagem)}"></div><div class="campo"><label>Título</label><small>Título usado também na busca.</small><input id="tit_${p.id}" value="${limpar(p.titulo)}"></div><div class="campo"><label>Preço</label><small>Preço exibido na loja.</small><input id="pre_${p.id}" value="${limpar(p.preco)}"></div><div class="campo"><label>Estoque</label><small>Estoque visível somente no ADM.</small><input id="est_${p.id}" value="${limpar(p.estoque)}"></div><div class="campo full"><label>Descrição</label><small>Descrição curta exibida no card.</small><textarea id="des_${p.id}">${limpar(p.descricao)}</textarea></div><div class="campo full"><label>Detalhes</label><small>Descrição completa em parágrafos.</small><textarea id="det_${p.id}">${limpar(p.detalhes)}</textarea></div><div class="campo full"><label>Faixa do produto</label><small>Texto da faixa.</small><input id="fai_${p.id}" value="${limpar(p.faixa||'')}"></div></div><button class="btn-save" onclick="salvarProduto('${p.id}')">SALVAR E SAIR</button> <button class="btn-danger" onclick="apagarProduto('${p.id}')">APAGAR</button></div>`}window.salvarConfig=async()=>{await db.ref('config').set({nomeSite:$('cfgNome').value,whatsapp:whats($('cfgWhats').value),faixa:$('cfgFaixa').value});aviso('Salvo')};window.salvarProduto=async id=>{await db.ref('produtos/'+id).update({imagem:$('img_'+id).value,titulo:$('tit_'+id).value,preco:$('pre_'+id).value,estoque:Number($('est_'+id).value)||0,descricao:$('des_'+id).value,detalhes:$('det_'+id).value,faixa:$('fai_'+id).value});aviso('Produto salvo')};window.apagarProduto=async id=>{if(confirm('Apagar produto?')){await db.ref('produtos/'+id).remove();aviso('Produto apagado')}};window.cadastrarProduto=async()=>{let r=db.ref('produtos').push();await r.set({id:r.key,imagem:$('nImagem').value||'https://picsum.photos/seed/novo/700/700',titulo:$('nTitulo').value||'Novo produto',preco:$('nPreco').value||0,estoque:Number($('nEstoque').value)||0,descricao:$('nDescricao').value||'',detalhes:$('nDetalhes').value||'',faixa:$('nFaixa').value||''});aviso('Produto cadastrado');renderAdm('produtos')};function carregarPedidos(){db.ref('pedidos').limitToLast(100).once('value',s=>{let v=s.val()||{},arr=Object.keys(v).reverse().map(k=>({id:k,...v[k]}));$('listaPedidos').innerHTML=arr.map(o=>`<div class="pedido"><b>${limpar(o.dados?.nome)} ${limpar(o.dados?.sobrenome)}</b><br><small>${new Date(o.data).toLocaleString('pt-BR')} | ${limpar(o.dados?.whatsapp)}</small><p><b>Total:</b> ${dinheiro(o.total)}</p><p>${(o.itens||[]).map(i=>limpar(i.titulo)+' - qtd: '+i.quantidade).join('<br>')}</p><button class="btn-save" onclick="editarPedido('${o.id}')">EDITAR</button> <button class="btn-danger" onclick="apagarPedido('${o.id}')">APAGAR</button></div>`).join('')||'<div class="vazio">Nenhum pedido.</div>'})}window.editarPedido=async id=>{let s=await db.ref('pedidos/'+id).once('value'),o=s.val(),status=prompt('Editar status do pedido:',o.status||'Novo');if(status!==null){await db.ref('pedidos/'+id+'/status').set(status);carregarPedidos()}};window.apagarPedido=async id=>{if(confirm('Apagar pedido?')){await db.ref('pedidos/'+id).remove();carregarPedidos()}};function carregarDesejos(){db.ref('produtos_desejados').limitToLast(100).once('value',s=>{let v=s.val()||{},arr=Object.keys(v).reverse().map(k=>({id:k,...v[k]}));$('listaDesejos').innerHTML=arr.map(d=>`<div class="desejo"><b>${limpar(d.produto)}</b><br><small>Cliente: ${limpar(d.nome)} | ${new Date(d.data).toLocaleString('pt-BR')}</small><br><button class="btn-danger" onclick="apagarDesejo('${d.id}')">APAGAR</button></div>`).join('')||'<div class="vazio">Nenhum produto desejado.</div>'})}window.apagarDesejo=async id=>{if(confirm('Apagar pedido?')){await db.ref('produtos_desejados/'+id).remove();carregarDesejos()}};function arrastar(el){let ativo=false,sx=0,sy=0,ex=0,ey=0;el.addEventListener('pointerdown',e=>{ativo=true;sx=e.clientX;sy=e.clientY;let r=el.getBoundingClientRect();ex=r.left;ey=r.top;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!ativo)return;el.style.left=Math.max(4,Math.min(innerWidth-65,ex+e.clientX-sx))+'px';el.style.top=Math.max(55,Math.min(innerHeight-65,ey+e.clientY-sy))+'px';el.style.right='auto';el.style.bottom='auto'});el.addEventListener('pointerup',()=>ativo=false)}arrastar($('btnCarrinho'));arrastar($('btnWhats'));iniciar().then(ouvir).catch(()=>aviso('Erro ao conectar Firebase'));
})();
