<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="site-title-tag">BRITOTEM.COM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --blue: #0056b3; --dark: #001a35; --white: #ffffff; --gray: #f4f7f6; --led: #ff004c; --green: #2ecc71; --orange: #ee4d2d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--gray); color: #333; overflow-x: hidden; -webkit-user-select: none; user-select: none; }

        /* HEADER & SEARCH */
        header { background: var(--blue); padding: 12px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo-box img { max-height: 40px; border-radius: 4px; }
        .site-name-top { color: white; font-weight: bold; font-size: 1.2rem; }
        
        .search-container { position: relative; width: 100%; }
        .search-container input { width: 100%; padding: 10px 40px 10px 15px; border-radius: 6px; border: none; outline: none; font-size: 0.9rem; }
        .search-container i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #888; }

        /* SHOPEE STYLE GRID */
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; } }

        .card { background: var(--white); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: zoom-in; }
        .p-body { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; }
        .p-title { font-size: 0.85rem; color: #222; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; margin-bottom: 4px; }
        .p-price { color: var(--orange); font-size: 1.1rem; font-weight: bold; margin-top: auto; }
        
        .p-badge { background: var(--blue); color: white; font-size: 0.65rem; padding: 3px 6px; border-radius: 2px; margin-bottom: 5px; width: fit-content; font-weight: bold; }

        .btn-detalhe { background: #f0f2f5; border: 1px solid #ddd; padding: 6px; font-size: 0.75rem; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 5px; color: var(--blue); font-weight: bold; }
        .btn-add { background: var(--blue); color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; border-radius: 4px; font-size: 0.85rem; }

        /* FLOATING DRAGGABLES */
        .draggable { position: fixed; z-index: 5000; cursor: move; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border-radius: 50%; width: 60px; height: 60px; touch-action: none; }
        .wp-float { bottom: 20px; left: 20px; background: #25d366; font-size: 32px; color: white; text-decoration: none; }
        .cart-float { bottom: 20px; right: 20px; background: var(--blue); font-size: 24px; color: white; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--led); color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; box-shadow: 0 0 10px var(--led); }

        /* MODALS */
        .modal-side { position: fixed; top: 0; right: -100%; width: 100%; max-width: 450px; height: 100%; background: white; z-index: 6000; transition: 0.4s; padding: 20px; overflow-y: auto; box-shadow: -5px 0 20px rgba(0,0,0,0.2); }
        .modal-side.active { right: 0; }
        .cart-row { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; align-items: center; }
        .cart-row img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }
        
        .zoom-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; justify-content: center; align-items: center; cursor: zoom-out; }
        .zoom-overlay img { max-width: 95%; max-height: 85%; border-radius: 8px; }

        /* ADM PANEL */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; z-index: 8000; padding: 20px; overflow-y: auto; color: #333; }
        .adm-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .quick-edit-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: center; min-width: 700px; padding: 10px 0; border-bottom: 1px solid #eee; }
        
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        label { font-size: 0.7rem; font-weight: bold; color: var(--blue); text-transform: uppercase; }

        footer { background: var(--dark); color: white; padding: 40px 5%; text-align: center; margin-top: 30px; }
        .btn-a-trigger { float: left; opacity: 0.05; color: white; text-decoration: none; font-size: 10px; }
        
        .p-desc-modern p { margin-bottom: 15px; line-height: 1.6; color: #444; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <div class="header-top">
            <div class="logo-box"><img id="v-logo" src="" alt="Logo"></div>
            <div class="site-name-top" id="v-site-name">BRITOTEM.COM</div>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="O que você deseja hoje?" onkeyup="filtrarProdutos()">
            <i class="fas fa-search"></i>
        </div>
    </header>

    <div class="container">
        <!-- Grade Shopee -->
        <div class="grid" id="product-grid"></div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ddd;">

        <!-- Parte 2: Sorteio -->
        <div class="adm-card" id="sorteio-section">
            <img id="v-s-banner" src="" style="width:100%; border-radius:8px; margin-bottom:15px;">
            <h2 id="v-s-titulo" style="color: var(--blue);"></h2>
            <div id="v-s-desc" class="p-desc-modern"></div>
            <div style="margin-top:20px;">
                <input type="text" id="s-nome" placeholder="Seu Nome Completo">
                <input type="text" id="s-cpf" placeholder="Seu CPF">
                <input type="text" id="s-whats" placeholder="Seu WhatsApp">
                <input type="text" id="s-indica" placeholder="WhatsApp de quem te indicou (Obrigatório)">
                <button class="btn-add" style="background:var(--green);" onclick="cadastrarSorteio()">CADASTRAR NO SORTEIO</button>
            </div>
        </div>

        <!-- Sugestão de Produto -->
        <div class="adm-card" style="border-left: 5px solid var(--blue);">
            <h4 style="color: var(--blue);">Não encontrou o que buscava?</h4>
            <p style="font-size: 0.8rem; margin-bottom: 10px;">Sugira um produto e avisaremos quando chegar!</p>
            <input type="text" id="missing-p" placeholder="Qual produto você quer ver aqui?">
            <button class="btn-add" onclick="pedirProduto()">ENVIAR SUGESTÃO</button>
        </div>
    </div>

    <!-- WhatsApp Arrastável -->
    <div id="wp-drag" class="draggable wp-float" onmousedown="dragStart(event, this)" ontouchstart="dragStart(event, this)">
        <a href="" id="v-wp-link" target="_blank" style="color:white;"><i class="fab fa-whatsapp"></i></a>
    </div>

    <!-- Carrinho Arrastável -->
    <div id="cart-drag" class="draggable cart-float" onmousedown="dragStart(event, this)" ontouchstart="dragStart(event, this)" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <div class="cart-badge" id="cart-count">0</div>
    </div>

    <!-- Carrinho Lateral -->
    <div id="modal-cart" class="modal-side">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
            <h3>🛒 Checkout</h3>
            <span onclick="toggleCart()" style="cursor:pointer; font-size: 30px;">&times;</span>
        </div>
        <div id="cart-list"></div>
        
        <div id="coupon-area" style="background:#f0f5ff; padding:15px; border-radius:8px; margin-top:15px;">
            <label>Cupom de Desconto</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="f-cupom" placeholder="Código">
                <button onclick="validarCupom()" style="padding:10px; background:var(--blue); color:white; border:none; border-radius:6px;">OK</button>
            </div>
            <div id="cupom-msg" style="font-size:0.75rem; margin-top:5px;"></div>
        </div>

        <div id="checkout-form" style="display:none; margin-top:20px;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <input type="text" id="f-nome" placeholder="Nome">
                <input type="text" id="f-sobrenome" placeholder="Sobrenome">
            </div>
            <input type="text" id="f-cpf" placeholder="CPF">
            <input type="text" id="f-whats" placeholder="WhatsApp">
            <input type="text" id="f-rua" placeholder="Rua / Avenida">
            <input type="text" id="f-bairro" placeholder="Bairro">
            <input type="text" id="f-casa" placeholder="Nº da Casa">
            <input type="text" id="v-cidade-atend" disabled style="background:#eee; font-weight:bold;">
            <textarea id="f-obs" placeholder="Alguma observação?"></textarea>
            
            <h2 id="v-total" style="color: var(--orange); margin: 15px 0; text-align: right;">Total: R$ 0,00</h2>
            <button class="btn-add" style="background:var(--green); font-size: 1.1rem;" onclick="finalizarPedido()">FINALIZAR</button>
            <button class="btn-add" style="background:#888;" onclick="toggleCart()">CONTINUAR COMPRANDO</button>
        </div>
    </div>

    <!-- Zoom Viewer -->
    <div class="zoom-overlay" id="zoom-overlay" onclick="this.style.display='none'"><img id="zoom-img"></div>

    <!-- PAINEL ADM -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2>⚙️ Master Admin BRITOTEM</h2>
            <button onclick="location.reload()" style="padding:10px 20px; border-radius:6px;">SAIR</button>
        </div>

        <div class="adm-card">
            <h4>1. Configurações Gerais</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div><label>Nome do Site</label><input type="text" id="adm-nome"></div>
                <div><label>WhatsApp Central</label><input type="text" id="adm-whats"></div>
            </div>
            <label>Link da Logo</label><input type="text" id="adm-logo">
            <label>Texto Faixa Azul (Produtos)</label><input type="text" id="adm-led-txt">
            <label>Aviso de Atendimento</label><input type="text" id="adm-cidade-txt">
            <label>Texto do Rodapé</label><textarea id="adm-footer"></textarea>
            <button class="btn-add" onclick="saveConfig()">ATUALIZAR SITE</button>
        </div>

        <div class="adm-card">
            <h4>2. Cupom & Sorteio</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <div><label>Código</label><input type="text" id="adm-c-code"></div>
                <div><label>% Desc.</label><input type="number" id="adm-c-pct"></div>
                <div><label>Validade</label><input type="date" id="adm-c-val"></div>
            </div>
            <hr style="margin:20px 0;">
            <label>Link Banner Sorteio</label><input type="text" id="adm-s-banner">
            <label>Título Sorteio</label><input type="text" id="adm-s-tit">
            <label>Descrição Sorteio</label><textarea id="adm-s-desc" rows="4"></textarea>
            <button class="btn-add" style="background:#6f42c1" onclick="saveExtras()">SALVAR EXTRAS</button>
        </div>

        <div class="adm-card" style="overflow-x: auto;">
            <h4>3. Gestão de Produtos</h4>
            <div id="adm-product-list"></div>
            <br>
            <h5>Adicionar Novo</h5>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px;">
                <input type="text" id="p-new-nome" placeholder="Título">
                <input type="number" id="p-new-preco" placeholder="Preço">
                <input type="number" id="p-new-estoque" placeholder="Estoque">
            </div>
            <input type="text" id="p-new-img" placeholder="Link da Imagem">
            <textarea id="p-new-det" placeholder="Detalhes (Use Enter para parágrafos)"></textarea>
            <button class="btn-add" onclick="addProduct()">CADASTRAR PRODUTO</button>
        </div>

        <div class="adm-card">
            <h4>4. Logs de Registros</h4>
            <div id="adm-logs" style="font-size: 0.8rem; line-height: 1.5;"></div>
        </div>
    </div>

    <footer>
        <a href="#" class="btn-a-trigger" onclick="openAdmin()">A</a>
        <div id="v-footer-text"></div>
    </footer>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCf6_DCNSh4a3IiOtTv5Uf_N8YaxQtBczw",
            authDomain: "loja-a33e1.firebaseapp.com",
            databaseURL: "https://loja-a33e1-default-rtdb.firebaseio.com",
            projectId: "loja-a33e1",
            storageBucket: "loja-a33e1.firebasestorage.app",
            messagingSenderId: "304798626706",
            appId: "1:304798626706:web:23a0672e6a98ae432c474b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let cart = [];
        let siteData = {};
        let cupomAtivo = null;
        let descFinal = 0;

        // LOAD DATA
        onValue(ref(db), (snap) => {
            const data = snap.val() || {};
            siteData = data.config || { nome: 'BRITOTEM.COM', whats: '47988771313', led: 'Frete Grátis - Chega Amanhã', atend: 'Atendemos Somente Rio Negrinho SC' };
            cupomAtivo = data.cupom || null;
            
            // Site UI Update
            document.getElementById('v-site-name').innerText = siteData.nome;
            document.getElementById('site-title-tag').innerText = siteData.nome;
            document.getElementById('v-logo').src = siteData.logo || '';
            document.getElementById('v-wp-link').href = `https://wa.me/55${siteData.whats}`;
            document.getElementById('v-footer-text').innerText = siteData.footer || '© 2026 BRITOTEM';
            document.getElementById('v-cidade-atend').value = siteData.atend;

            // Sorteio UI
            const s = data.sorteio_config || {};
            document.getElementById('v-s-banner').src = s.banner || '';
            document.getElementById('v-s-titulo').innerText = s.titulo || 'Sorteio do Mês';
            document.getElementById('v-s-desc').innerHTML = s.desc ? s.desc.split('\n').map(p => `<p>${p}</p>`).join('') : '';

            // ADM Fill
            document.getElementById('adm-nome').value = siteData.nome;
            document.getElementById('adm-whats').value = siteData.whats;
            document.getElementById('adm-logo').value = siteData.logo || '';
            document.getElementById('adm-led-txt').value = siteData.led;
            document.getElementById('adm-cidade-txt').value = siteData.atend;
            document.getElementById('adm-footer').value = siteData.footer || '';
            if(cupomAtivo) {
                document.getElementById('adm-c-code').value = cupomAtivo.code;
                document.getElementById('adm-c-pct').value = cupomAtivo.pct;
                document.getElementById('adm-c-val').value = cupomAtivo.val;
            }
            document.getElementById('adm-s-banner').value = s.banner || '';
            document.getElementById('adm-s-tit').value = s.titulo || '';
            document.getElementById('adm-s-desc').value = s.desc || '';

            renderProducts(data.produtos);
            renderLogs(data);
        });

        function renderProducts(prods) {
            const grid = document.getElementById('product-grid');
            const admList = document.getElementById('adm-product-list');
            grid.innerHTML = ""; admList.innerHTML = "";
            
            for(let id in prods) {
                let p = prods[id];
                // Storefront
                grid.innerHTML += `
                    <div class="card" data-title="${p.nome.toLowerCase()}">
                        <img src="${p.img}" onclick="zoom('${p.img}')">
                        <div class="p-body">
                            <div class="p-badge">${siteData.led}</div>
                            <div class="p-title">${p.nome}</div>
                            <div class="p-price">R$ ${parseFloat(p.preco).toFixed(2)}</div>
                            <button class="btn-detalhe" onclick="abrirDetalhe('${p.nome}', \`${p.det}\`)">Detalhes</button>
                            <button class="btn-add" onclick="addToCart('${id}', '${p.nome}', ${p.preco}, '${p.img}')">ADICIONAR</button>
                        </div>
                    </div>
                `;
                // ADM Quick Edit
                admList.innerHTML += `
                    <div class="quick-edit-grid">
                        <input type="text" value="${p.nome}" onchange="quickUpdate('${id}', 'nome', this.value)">
                        <input type="number" value="${p.preco}" onchange="quickUpdate('${id}', 'preco', this.value)">
                        <input type="number" value="${p.estoque}" onchange="quickUpdate('${id}', 'estoque', this.value)">
                        <input type="text" value="${p.img}" onchange="quickUpdate('${id}', 'img', this.value)">
                        <button onclick="removeProd('${id}')" style="color:red; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }
        }

        // LOJA LOGIC
        window.zoom = (src) => { document.getElementById('zoom-img').src = src; document.getElementById('zoom-overlay').style.display = 'flex'; };
        
        window.abrirDetalhe = (title, text) => {
            let html = text.split('\n').map(p => `<p style="margin-bottom:10px">${p}</p>`).join('');
            Swal.fire({ title: title, html: `<div style="text-align:left; font-size:0.9rem;">${html}</div>`, confirmButtonColor: '#0056b3' });
        };

        window.addToCart = (id, nome, preco, img) => {
            cart.push({id, nome, preco, img});
            document.getElementById('cart-count').innerText = cart.length;
            Swal.fire({ icon: 'success', title: 'Adicionado!', timer: 800, showConfirmButton: false });
        };

        window.toggleCart = () => {
            document.getElementById('modal-cart').classList.toggle('active');
            renderCart();
            loadClientData();
        };

        function renderCart() {
            const list = document.getElementById('cart-list');
            const form = document.getElementById('checkout-form');
            if(cart.length > 0) {
                form.style.display = 'block';
                list.innerHTML = cart.map((item, index) => `
                    <div class="cart-row">
                        <img src="${item.img}">
                        <div style="flex-grow:1"><b>${item.nome}</b><br>R$ ${item.preco.toFixed(2)}</div>
                        <i class="fas fa-times-circle" style="color:red; cursor:pointer" onclick="removeFromCart(${index})"></i>
                    </div>
                `).join('');
                updateTotal();
            } else {
                list.innerHTML = "Seu carrinho está vazio.";
                form.style.display = 'none';
            }
        }

        window.removeFromCart = (idx) => { cart.splice(idx, 1); renderCart(); document.getElementById('cart-count').innerText = cart.length; };

        window.validarCupom = () => {
            const cod = document.getElementById('f-cupom').value.toUpperCase();
            const msg = document.getElementById('cupom-msg');
            const hoje = new Date().toISOString().split('T')[0];
            if(cupomAtivo && cod === cupomAtivo.code && hoje <= cupomAtivo.val) {
                descFinal = cupomAtivo.pct;
                msg.innerHTML = `<span style="color:green">Cupom aplicado! ${descFinal}% OFF</span>`;
            } else {
                descFinal = 0;
                msg.innerHTML = `<span style="color:red">Cupom inválido ou expirado.</span>`;
            }
            updateTotal();
        };

        function updateTotal() {
            let bruto = cart.reduce((a, b) => a + b.preco, 0);
            let total = bruto - (bruto * (descFinal / 100));
            document.getElementById('v-total').innerText = `Total: R$ ${total.toFixed(2)}`;
        }

        window.finalizarPedido = () => {
            const client = {
                nome: document.getElementById('f-nome').value,
                sobrenome: document.getElementById('f-sobrenome').value,
                whats: document.getElementById('f-whats').value,
                rua: document.getElementById('f-rua').value,
                bairro: document.getElementById('f-bairro').value,
                casa: document.getElementById('f-casa').value
            };
            if(!client.nome || !client.whats) return Swal.fire('Erro','Nome e Whats obrigatórios!','error');
            
            localStorage.setItem('brito_client', JSON.stringify(client));
            let sub = cart.reduce((a,b) => a + b.preco, 0);
            let total = (sub - (sub * (descFinal / 100))).toFixed(2);
            let pNames = cart.map(i => i.nome).join(', ');

            push(ref(db, 'vendas'), { client, total, pNames, data: new Date().toLocaleString() });

            let msg = `*PEDIDO - ${siteData.nome}*%0A%0A*Cliente:* ${client.nome}%0A*Whats:* ${client.whats}%0A*Endereço:* ${client.rua}, ${client.casa} - ${client.bairro}%0A%0A*Itens:* ${pNames}%0A%0A*TOTAL: R$ ${total}*`;
            window.open(`https://wa.me/55${siteData.whats}?text=${msg}`);
            cart = []; toggleCart(); document.getElementById('cart-count').innerText = "0";
        };

        // EXTRAS
        window.cadastrarSorteio = () => {
            const s = { 
                nome: document.getElementById('s-nome').value, 
                cpf: document.getElementById('s-cpf').value,
                whats: document.getElementById('s-whats').value, 
                indica: document.getElementById('s-indica').value 
            };
            if(!s.nome || !s.whats || !s.indica) return Swal.fire('Erro','Preencha todos os campos!','error');
            if(s.whats === s.indica) return Swal.fire('Erro','WhatsApp da indicação deve ser diferente do seu!','error');
            push(ref(db, 'sorteio_vips'), s);
            Swal.fire('Boa Sorte!','Cadastro realizado com sucesso!','success');
        };

        window.pedirProduto = () => {
            const p = document.getElementById('missing-p').value;
            if(!p) return;
            push(ref(db, 'pedidos_faltantes'), { nome: p, data: new Date().toLocaleString() });
            Swal.fire('Recebido!','Anotamos sua sugestão.','success');
            document.getElementById('missing-p').value = "";
        };

        // ADM LOGIC
        window.openAdmin = () => {
            Swal.fire({ title: 'Acesso Restrito', input: 'password', showCancelButton: true }).then(r => {
                if(r.value === "848218") document.getElementById('admin-panel').style.display = 'block';
                else if(r.value) Swal.fire('Negado','Senha incorreta','error');
            });
        };

        window.saveConfig = () => {
            set(ref(db, 'config'), {
                nome: document.getElementById('adm-nome').value,
                whats: document.getElementById('adm-whats').value,
                logo: document.getElementById('adm-logo').value,
                led: document.getElementById('adm-led-txt').value,
                atend: document.getElementById('adm-cidade-txt').value,
                footer: document.getElementById('adm-footer').value
            });
            Swal.fire('OK','Configurações Salvas','success');
        };

        window.saveExtras = () => {
            set(ref(db, 'cupom'), {
                code: document.getElementById('adm-c-code').value.toUpperCase(),
                pct: parseFloat(document.getElementById('adm-c-pct').value),
                val: document.getElementById('adm-c-val').value
            });
            set(ref(db, 'sorteio_config'), {
                banner: document.getElementById('adm-s-banner').value,
                titulo: document.getElementById('adm-s-tit').value,
                desc: document.getElementById('adm-s-desc').value
            });
            Swal.fire('OK','Sorteio e Cupom atualizados','success');
        };

        window.addProduct = () => {
            const p = {
                nome: document.getElementById('p-new-nome').value,
                preco: parseFloat(document.getElementById('p-new-preco').value),
                estoque: parseInt(document.getElementById('p-new-estoque').value),
                img: document.getElementById('p-new-img').value,
                det: document.getElementById('p-new-det').value
            };
            push(ref(db, 'produtos'), p);
            Swal.fire('Sucesso','Produto adicionado','success');
        };

        window.quickUpdate = (id, field, value) => {
            const up = {}; up[`/produtos/${id}/${field}`] = (field === 'preco' || field === 'estoque') ? parseFloat(value) : value;
            update(ref(db), up);
        };

        window.removeProd = (id) => { if(confirm('Excluir este produto?')) remove(ref(db, `produtos/${id}`)); };

        function renderLogs(data) {
            const div = document.getElementById('adm-logs');
            let html = "<strong>Vendas:</strong><br>";
            if(data.vendas) Object.values(data.vendas).reverse().forEach(v => html += `${v.data} - ${v.client.nome}: R$ ${v.total}<br>`);
            html += "<br><strong>Sorteios:</strong><br>";
            if(data.sorteio_vips) Object.values(data.sorteio_vips).reverse().forEach(s => html += `${s.nome} (${s.whats}) - Indicou: ${s.indica}<br>`);
            html += "<br><strong>Pedidos Faltantes:</strong><br>";
            if(data.pedidos_faltantes) Object.values(data.pedidos_faltantes).reverse().forEach(f => html += `${f.data}: ${f.nome}<br>`);
            div.innerHTML = html;
        }

        function loadClientData() {
            const saved = localStorage.getItem('brito_client');
            if(saved) {
                const c = JSON.parse(saved);
                document.getElementById('f-nome').value = c.nome || '';
                document.getElementById('f-sobrenome').value = c.sobrenome || '';
                document.getElementById('f-whats').value = c.whats || '';
                document.getElementById('f-rua').value = c.rua || '';
                document.getElementById('f-bairro').value = c.bairro || '';
                document.getElementById('f-casa').value = c.casa || '';
            }
        }
    </script>

    <script>
        // DRAG & SEARCH & SECURITY
        let activeEl, isDragging = false, offset = [0,0];

        function dragStart(e, el) {
            isDragging = true; activeEl = el;
            const ev = e.type === 'touchstart' ? e.touches[0] : e;
            offset = [el.offsetLeft - ev.clientX, el.offsetTop - ev.clientY];
        }
        function move(e) {
            if(!isDragging) return;
            const ev = e.type === 'touchmove' ? e.touches[0] : e;
            activeEl.style.left = (ev.clientX + offset[0]) + 'px';
            activeEl.style.top = (ev.clientY + offset[1]) + 'px';
            activeEl.style.bottom = 'auto'; activeEl.style.right = 'auto';
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('touchmove', move);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('touchend', () => isDragging = false);

        window.filtrarProdutos = () => {
            const t = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#product-grid .card').forEach(c => {
                c.style.display = c.getAttribute('data-title').includes(t) ? 'flex' : 'none';
            });
        };

        // Bloqueio F12 e Inspeção básica
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) return false; };
    </script>
</body>
</html>
